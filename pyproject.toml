[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-lab"
version = "0.0.1"
description = "Personal project lab on Proxmox: fast VMs, Tailscale, verified archives"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lab = "lab.entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab = ["data/*.toml", "data/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
