name: Release

# Push a tag like v0.2.0 to publish a release: tests run, the `lab` client is built for Windows, macOS and
# Linux (x64 and ARM64 each) and attached to the GitHub release together with SHA256SUMS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: verify the tag and run the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in the code
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${version}\"" pyproject.toml || { echo "pyproject.toml version is not ${version}"; exit 1; }
          grep -q "__version__ = \"${version}\"" src/lab/__init__.py || { echo "src/lab/__init__.py version is not ${version}"; exit 1; }
      - run: python -m unittest discover -s tests -t .

  client:
    name: lab (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    # builds on runners that may be scarce (ARM, Intel Mac) never block the release
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows x64",   runner: windows-latest,    asset: lab-windows-x64,   ext: ".exe", sep: ";", optional: false }
          - { name: "Windows ARM64", runner: windows-11-arm,    asset: lab-windows-arm64, ext: ".exe", sep: ";", optional: true }
          # built on 22.04 so the binary also runs on older distributions (it needs the build system's glibc or newer)
          - { name: "Linux x64",     runner: ubuntu-22.04,      asset: lab-linux-x64,     ext: "",     sep: ":", optional: false }
          - { name: "Linux ARM64",   runner: ubuntu-22.04-arm,  asset: lab-linux-arm64,   ext: "",     sep: ":", optional: true }
          - { name: "macOS ARM64",   runner: macos-latest,      asset: lab-macos-arm64,   ext: "",     sep: ":", optional: false }
          - { name: "macOS x64",     runner: macos-15-intel,    asset: lab-macos-x64,     ext: "",     sep: ":", optional: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --noconfirm --clean --name "${{ matrix.asset }}" --paths src \
            --add-data "src/lab/data${{ matrix.sep }}lab/data" --collect-submodules lab packaging/lab_exe.py
      - name: Smoke test the binary
        shell: bash
        run: |
          "./dist/${{ matrix.asset }}${{ matrix.ext }}" version
          "./dist/${{ matrix.asset }}${{ matrix.ext }}" check
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}${{ matrix.ext }}

  package:
    name: host package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the tarball the host installer downloads
        run: git archive --format=tar.gz --prefix="project-lab-${GITHUB_REF_NAME}/" -o "project-lab-${GITHUB_REF_NAME}.tar.gz" HEAD src LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: project-lab-source
          path: project-lab-*.tar.gz

  publish:
    name: publish the release
    needs: [client, package]
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.client.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cp install.sh install.ps1 install-client.sh assets/
          cd assets
          sha256sum project-lab-*.tar.gz lab-windows-* lab-linux-* lab-macos-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          **Proxmox host** (as root):
          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          ```

          **Windows PC** (PowerShell):
          ```powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
          ```

          **macOS or Linux computer**:
          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install-client.sh | bash
          ```

          Every installer checks the download against `SHA256SUMS`. The programs are not code-signed.
          EOF
          gh release create "${GITHUB_REF_NAME}" assets/* --title "${GITHUB_REF_NAME}" --generate-notes --notes-file notes.md
