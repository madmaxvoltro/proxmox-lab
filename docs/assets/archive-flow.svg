<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Archive flow: stop, back up, verify, trial restore, boot test, then remove the original">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker></defs>
  <rect width="1080" height="330" rx="18" fill="#0d1117"/>
  <text x="540.0" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#e6edf3">An archive is only real once it has been proven</text>
  <rect x="30" y="84" width="150" height="150" rx="14" fill="#161b22" stroke="#30363d"/><circle cx="58" cy="112" r="13" fill="#1f6feb"/><text x="58" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text x="44" y="156" font-size="16" font-weight="700" fill="#e6edf3">Stop</text><text x="44" y="180" font-size="12.5" fill="#8b949e">graceful,</text><text x="44" y="198" font-size="12.5" fill="#8b949e">never forced</text><path d="M184 159 h16" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a)"/><rect x="204" y="84" width="150" height="150" rx="14" fill="#161b22" stroke="#30363d"/><circle cx="232" cy="112" r="13" fill="#1f6feb"/><text x="232" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="218" y="156" font-size="16" font-weight="700" fill="#e6edf3">Back up</text><text x="218" y="180" font-size="12.5" fill="#8b949e">to the archive</text><text x="218" y="198" font-size="12.5" fill="#8b949e">disk</text><path d="M358 159 h16" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a)"/><rect x="378" y="84" width="150" height="150" rx="14" fill="#161b22" stroke="#30363d"/><circle cx="406" cy="112" r="13" fill="#1f6feb"/><text x="406" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="392" y="156" font-size="16" font-weight="700" fill="#e6edf3">Verify</text><text x="392" y="180" font-size="12.5" fill="#8b949e">zstd integrity</text><text x="392" y="198" font-size="12.5" fill="#8b949e">+ SHA-256</text><path d="M532 159 h16" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a)"/><rect x="552" y="84" width="150" height="150" rx="14" fill="#161b22" stroke="#30363d"/><circle cx="580" cy="112" r="13" fill="#1f6feb"/><text x="580" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text x="566" y="156" font-size="16" font-weight="700" fill="#e6edf3">Trial restore</text><text x="566" y="180" font-size="12.5" fill="#8b949e">temporary VM,</text><text x="566" y="198" font-size="12.5" fill="#8b949e">network unplugged</text><path d="M706 159 h16" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a)"/><rect x="726" y="84" width="150" height="150" rx="14" fill="#161b22" stroke="#30363d"/><circle cx="754" cy="112" r="13" fill="#1f6feb"/><text x="754" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><text x="740" y="156" font-size="16" font-weight="700" fill="#e6edf3">Boot test</text><text x="740" y="180" font-size="12.5" fill="#8b949e">agent, disk, user,</text><text x="740" y="198" font-size="12.5" fill="#8b949e">hostname</text><path d="M880 159 h16" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a)"/><rect x="900" y="84" width="150" height="150" rx="14" fill="#0f2d1d" stroke="#238636"/><circle cx="928" cy="112" r="13" fill="#1f6feb"/><text x="928" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text><text x="914" y="156" font-size="16" font-weight="700" fill="#e6edf3">Remove original</text><text x="914" y="180" font-size="12.5" fill="#8b949e">only now</text>
  <path d="M627.0 238 v26 h-502 v-26" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <text x="540.0" y="292" text-anchor="middle" font-size="14" fill="#f85149" font-weight="600">Any failure before step 6: the new backup and temporary VM are deleted, your original restarts untouched.</text>
  <text x="540.0" y="314" text-anchor="middle" font-size="12.5" fill="#8b949e">Crash or power cut in the middle? `lab recover` rolls it back, or finishes it if the archive was already verified.</text>
</svg>
