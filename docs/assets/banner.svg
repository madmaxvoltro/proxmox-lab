<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="proxmox-lab: disposable project VMs on Proxmox, safe for AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a4a"/><stop offset="0.55" stop-color="#3a1c6e"/><stop offset="1" stop-color="#b8486a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#ffb199" stop-opacity="0.55"/><stop offset="1" stop-color="#ffb199" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#3aa0ff" stop-opacity="0.45"/><stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="340" rx="24" fill="url(#glow2)"/>
  <text x="70" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#fff" letter-spacing="-2">proxmox-lab</text>
  <text x="74" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" fill="#fff" fill-opacity="0.92">Disposable project VMs on Proxmox.</text>
  <text x="74" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" fill="#fff" fill-opacity="0.92">Safe for AI: every risky step asks you first.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fff">
    <rect x="74" y="272" width="146" height="34" rx="17" fill="#fff" fill-opacity="0.16"/><text x="147" y="294" text-anchor="middle">Proxmox VE</text>
    <rect x="232" y="272" width="118" height="34" rx="17" fill="#fff" fill-opacity="0.16"/><text x="291" y="294" text-anchor="middle">Tailscale</text>
    <rect x="362" y="272" width="170" height="34" rx="17" fill="#fff" fill-opacity="0.16"/><text x="447" y="294" text-anchor="middle">MCP for Claude</text>
    <rect x="544" y="272" width="170" height="34" rx="17" fill="#fff" fill-opacity="0.16"/><text x="629" y="294" text-anchor="middle">Windows + Linux</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="880" y="62" width="320" height="216" rx="24" fill="#fff" fill-opacity="0.96"/>
  </g>
  <g fill="none" stroke="#007AFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1020" y="96" width="40" height="30" rx="7"/>
    <path d="M1028 96 v-9 a12 12 0 0 1 24 0 v9"/>
  </g>
  <circle cx="1040" cy="111" r="3.2" fill="#007AFF"/>
  <text x="1040" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f">Let Claude work in “demo”?</text>
  <text x="1040" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73">With your OK it can run commands and edit files.</text>
  <rect x="902" y="204" width="134" height="42" rx="12" fill="#e8e8ed"/><text x="969" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#1d1d1f">Deny</text>
  <rect x="1046" y="204" width="134" height="42" rx="12" fill="#007AFF"/><text x="1113" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#fff">Approve</text>
</svg>
