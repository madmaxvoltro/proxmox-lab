  <text x="450" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">lab create hello</text>
  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15"><text x="30" y="78" fill="#e6edf3" font-weight="700" xml:space="preserve">$ lab create hello</text><text x="30" y="103" fill="#3fb950" xml:space="preserve">✔ [1/5] Cloning the template into VMID 1000 (full clone) (16s)</text><text x="30" y="128" fill="#3fb950" xml:space="preserve">✔ [2/5] Configuring the VM (1s)</text><text x="30" y="153" fill="#3fb950" xml:space="preserve">✔ [3/5] Booting (11s)</text><text x="30" y="178" fill="#3fb950" xml:space="preserve">✔ [4/5] First-boot setup (9s)</text><text x="30" y="203" fill="#58a6ff" xml:space="preserve">● [5/5] Joining the tailnet  4s</text><text x="30" y="228" fill="#8b949e" xml:space="preserve">    lab-hello.your-tailnet.ts.net (100.101.102.103)</text><text x="30" y="253" fill="#c9d1d9" xml:space="preserve"></text><text x="30" y="278" fill="#e6edf3" font-weight="700" xml:space="preserve">$ lab exec hello -- uname -a</text><text x="30" y="303" fill="#c9d1d9" xml:space="preserve">Linux lab-hello 6.8.0-147-generic #147-Ubuntu SMP x86_64 GNU/Linux</text></g>
