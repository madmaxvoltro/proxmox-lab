name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -t .

  installer:
    name: installer script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ShellCheck
        run: shellcheck install.sh install-client.sh tests/installer_smoke.sh tests/client_installer_smoke.sh
      - name: Host installer against a local fake release (checksum, upgrade, uninstall, refusals)
        run: bash tests/installer_smoke.sh
      - name: Client installer against a local fake release (all four unix builds, checksum, upgrade, uninstall)
        run: bash tests/client_installer_smoke.sh

  client-installer-macos:
    name: client installer (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Client installer on macOS (bash 3.2, shasum, BSD tools)
        run: bash tests/client_installer_smoke.sh
